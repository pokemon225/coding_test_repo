spring.application.name=color-votes
server.port=${PORT:8080}

# Embedded H2 by default so the app runs with zero setup. Point these at PostgreSQL/MySQL
# (plus the matching JDBC driver) to use an external database; the migrations are portable SQL.
spring.datasource.url=${DATABASE_URL:jdbc:h2:mem:colorvotes;DB_CLOSE_DELAY=-1}
spring.datasource.username=${DATABASE_USERNAME:sa}
spring.datasource.password=${DATABASE_PASSWORD:}

spring.flyway.locations=classpath:db/migration

server.compression.enabled=true
server.error.include-stacktrace=never
spring.web.resources.cache.cachecontrol.max-age=1h

management.endpoints.web.exposure.include=health
